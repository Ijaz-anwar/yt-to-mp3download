name: Build Production Next.js App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: "https://yt-to-mp3.download"
      NEXT_PUBLIC_SITE_URL: "https://yt-to-mp3.download"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --webpack

      - name: Verify build artifact directory
        run: |
          if [ ! -d ".next" ] || [ ! -f ".next/BUILD_ID" ]; then
            echo "::error::Build verification failed: .next directory or .next/BUILD_ID not found."
            exit 1
          fi
          echo "Build successful. Generated $(du -sh .next | cut -f1) in .next."

      - name: Upload .next production artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: .next/
          retention-days: 14
          if-no-files-found: error
