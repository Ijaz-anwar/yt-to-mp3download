name: Build Production Next.js App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: "https://yt-to-mp3.download"
      NEXT_PUBLIC_SITE_URL: "https://yt-to-mp3.download"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build production bundle
        env:
          NODE_ENV: production
        run: npm run build -- --webpack

      - name: Inspect build output diagnostics
        run: |
          echo "=== Current Working Directory ==="
          pwd
          echo "=== Project Root Listing ==="
          ls -la
          echo "=== .next Directory Listing ==="
          ls -la .next

      - name: Verify build artifact directory
        run: |
          if [ ! -d ".next" ]; then
            echo "::error::Build directory .next was not created."
            exit 1
          fi
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "::error::Build verification failed: .next/BUILD_ID does not exist."
            exit 1
          fi
          echo "Build verification passed: .next/BUILD_ID exists (Build ID: $(cat .next/BUILD_ID))."
          echo "Total size generated: $(du -sh .next | cut -f1)"

      - name: Upload .next production artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: .next/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
